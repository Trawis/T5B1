# repo-seed-template:start
# Document role: Managed project-file template
# Template source: docs/templates/.github/repo-seed-audit.template.yml
# Scaffold destination: .github/workflows/repo-seed-audit.yml
# Scaffold behavior: The live file is project-owned and never overwritten by sync
# repo-seed-template:end

# Checks weekly whether this repository's repo-seed files are behind the latest
# release or have drifted, and keeps one issue open while they have. It changes
# no files. The tag below is the pack release that created this file. Dependabot
# can keep it current only if this repository has its own
# .github/dependabot.yml with a github-actions entry. Delete this file to turn the check off.
name: repo-seed audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    permissions:
      contents: read
      issues: write
    uses: Trawis/repo-seed/.github/workflows/audit.yml@v__PACK_VERSION__
