# repo-seed-template:start
# Document role: Managed project-file template
# Template source: docs/templates/.github/bug-report.template.yml
# Scaffold destination: .github/ISSUE_TEMPLATE/bug_report.yml
# Scaffold behavior: The live file is project-owned and never overwritten by sync
# repo-seed-template:end

name: Bug Report
description: Report a reproducible problem
labels: ["type: bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what happens instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Version or commit:
        - Operating system:
        - Runtime or SDK:
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include relevant logs or screenshots without exposing secrets.
