# repo-seed-template:start
# Document role: Managed project-file template
# Template source: docs/templates/.github/repo-seed-sync.template.yml
# Scaffold destination: .github/workflows/repo-seed-sync.yml
# Scaffold behavior: The live file is project-owned and never overwritten by sync
# repo-seed-template:end

# Opens or updates one managed-files PR; residual audit findings appear in the
# job summary. Use this instead of the audit caller for automatic updates.
# Dependabot can update the pinned workflow tag when configured for github-actions.
#
# Needs the repository setting "Allow GitHub Actions to create and approve pull
# requests". Pull-request runs triggered by the default token require approval.
# For unattended checks, pass an appropriately scoped personal access token or
# GitHub App token using the optional secrets block below.
name: repo-seed sync

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: Trawis/repo-seed/.github/workflows/sync.yml@v__PACK_VERSION__
    # with:
    #   pack-version: "__PACK_VERSION__"   # pin the pack instead of using the latest release
    # secrets:
    #   token: ${{ secrets.REPO_SEED_TOKEN }}
