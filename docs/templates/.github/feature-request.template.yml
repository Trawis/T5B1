# repo-seed-template:start
# Document role: Managed project-file template
# Template source: docs/templates/.github/feature-request.template.yml
# Scaffold destination: .github/ISSUE_TEMPLATE/feature_request.yml
# Scaffold behavior: The live file is project-owned and never overwritten by sync
# repo-seed-template:end

name: Feature Request
description: Propose an implementation-ready capability
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: "Not implementation-ready yet? Ask a maintainer to record it as `type: idea` instead."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the requested capability.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Optional. Provide useful implementation direction when known.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: List concrete, observable acceptance conditions.
      placeholder: |
        - Concrete, observable outcome.
    validations:
      required: true
