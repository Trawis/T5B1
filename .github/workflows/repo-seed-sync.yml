# Opens or updates one managed-files PR; residual audit findings appear in the
# job summary. Use this instead of the audit caller for automatic updates.
# Dependabot can update the pinned workflow tag when configured for github-actions.
#
# Needs the repository setting "Allow GitHub Actions to create and approve pull
# requests". Pull-request runs triggered by the default token require approval.
# For unattended checks, pass an appropriately scoped personal access token or
# GitHub App token using the optional secrets block below.
name: repo-seed sync

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      pull-requests: write
    uses: Trawis/repo-seed/.github/workflows/sync.yml@v6.19.1
    # with:
    #   pack-version: "6.19.1"   # pin the pack instead of using the latest release
    # secrets:
    #   token: ${{ secrets.REPO_SEED_TOKEN }}
