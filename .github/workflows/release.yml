name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.x'

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content -Raw "Trainer_v5/Trainer.Source/Helpers.cs"
          $match = [regex]::Match(
            $content,
            'public\s+static\s+string\s+Version\s*=>\s*"(?<version>\d+\.\d+\.\d+)";'
          )

          if (-not $match.Success) {
            throw "Could not read a semantic version from Helpers.Version."
          }

          $version = $match.Groups["version"].Value
          $tag = "v$version"
          $existingTag = git tag --list $tag

          if ($existingTag) {
            $tagCommit = git rev-list -n 1 $tag
            $currentCommit = git rev-parse HEAD

            if ($tagCommit -ne $currentCommit) {
              throw "Tag $tag already points to another commit. Increase Helpers.Version before releasing."
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = [System.IO.File]::ReadAllLines("CHANGELOG.md")
          $escaped = [regex]::Escape($version)
          # Any heading naming this version, well-formed or not, so duplicates and typos are caught.
          $candidates = @(0..($lines.Count - 1) | Where-Object { $lines[$_] -match "^#+\s*\[?v?$escaped\]?(?![\w.])" })

          if ($candidates.Count -eq 0) {
            throw "CHANGELOG.md has no section for $version."
          }
          if ($candidates.Count -gt 1) {
            throw "CHANGELOG.md has $($candidates.Count) headings for $version."
          }

          $start = $candidates[0]
          if ($lines[$start] -notmatch "^## \[$escaped\] - \d{4}-\d{2}-\d{2}$") {
            throw "CHANGELOG.md heading for $version is malformed: '$($lines[$start])'. Expected '## [$version] - YYYY-MM-DD'."
          }

          $end = $start + 1
          while ($end -lt $lines.Count -and $lines[$end] -notmatch '^#{1,2}\s') {
            $end++
          }

          $notes = ""
          if ($end -gt $start + 1) {
            $notes = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          }
          if (-not $notes) {
            throw "CHANGELOG.md section for $version is empty."
          }

          $commit = git rev-parse HEAD
          $body = "$notes`n`nRelease notes from ``CHANGELOG.md`` at $commit.`n"
          [System.IO.File]::WriteAllText("release-notes.md", $body, [System.Text.UTF8Encoding]::new($false))

      - name: Build (Release)
        run: dotnet build "Trainer v5 - Beta 1.sln" --configuration Release --no-incremental --property:Version=${{ steps.version.outputs.version }}

      - name: Format
        run: dotnet format "Trainer v5 - Beta 1.sln" --verify-no-changes

      - name: Test
        run: dotnet test "Trainer v5 - Beta 1.sln" --configuration Release --no-build

      - name: Stage release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item Trainer_v5/bin/Release/net46/Trainer_v5.dll release/
          Copy-Item -Recurse Trainer_v5/Trainer.Localization release/Trainer.Localization

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath Trainer_v${{ steps.version.outputs.version }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Trainer_v${{ steps.version.outputs.version }}
          path: Trainer_v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Trainer_v${{ steps.version.outputs.version }}_release_notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # The package and notes the build job produced for this commit, not a rebuild.
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Trainer_v${{ needs.build.outputs.version }}
          path: .

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Trainer_v${{ needs.build.outputs.version }}_release_notes
          path: .

      - name: Create versioned release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Trainer v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: Trainer_v${{ needs.build.outputs.version }}.zip
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
