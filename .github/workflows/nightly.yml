name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    name: Nightly build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Check for commits in the last 24 hours
        id: check
        shell: pwsh
        run: |
          $commits = git log --since="24 hours ago" --oneline
          if ($commits) {
            echo "has_commits=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "has_commits=false" >> $env:GITHUB_OUTPUT
          }

      - name: Read nightly version
        if: steps.check.outputs.has_commits == 'true'
        id: version
        shell: bash
        env:
          RC_NUMBER: ${{ github.run_number }}
        run: |
          # BEGIN nightly_base_version
          # Prints the nightly base: the higher of Helpers.Version and the next
          # patch after the highest stable vX.Y.Z tag. Prerelease tags are ignored.
          nightly_base_version() {
            local helpers="$1" tags="$2" stable
            stable=$(printf '%s\n' "$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n 1)
            if [ -z "$stable" ]; then
              echo "$helpers"
              return
            fi
            local next="${stable%.*}.$(( ${stable##*.} + 1 ))"
            printf '%s\n%s\n' "$helpers" "$next" | sort -V | tail -n 1
          }
          # END nightly_base_version

          helpers_version=$(sed -nE 's/.*public[[:space:]]+static[[:space:]]+string[[:space:]]+Version[[:space:]]*=>[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)";.*/\1/p' Trainer_v5/Trainer.Source/Helpers.cs | head -n 1)
          if [ -z "$helpers_version" ]; then
            echo "Could not read a semantic version from Helpers.Version." >&2
            exit 1
          fi

          base_version=$(nightly_base_version "$helpers_version" "$(git tag --list 'v*')")
          # A dotted numeric identifier keeps release candidates ordered by run number (SemVer 2.0.0, 11.4).
          version="$base_version-rc.$RC_NUMBER"
          tag="v$version"
          commit=$(git rev-parse HEAD)

          tag_commit=$(git rev-parse --quiet --verify "refs/tags/$tag^{commit}" || true)
          if [ -n "$tag_commit" ] && [ "$tag_commit" != "$commit" ]; then
            echo "Tag $tag already exists on commit $tag_commit, not $commit. Do not reuse tags." >&2
            exit 1
          fi

          echo "Helpers.Version $helpers_version -> nightly version $version"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"

      - name: Check existing nightly release
        if: steps.check.outputs.has_commits == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # A published release is immutable: its assets and tag cannot be repaired.
          # A leftover draft from a failed run of this tag is reused by the release step.
          $releases = gh release list --limit 200 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not list releases."
          }

          $existing = @($releases | Where-Object { $_.tagName -eq $env:TAG })

          if ($existing | Where-Object { -not $_.isDraft }) {
            throw "Release $env:TAG is already published and immutable. Do not retry this run; start a new nightly run for a new tag."
          }

          if ($existing) {
            Write-Output "Reusing leftover draft release $env:TAG from an earlier failed run."
          } elseif (git tag --list $env:TAG) {
            throw "Tag $env:TAG already exists without a release. Resolve it manually before retrying."
          }

      - name: Setup .NET
        if: steps.check.outputs.has_commits == 'true'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.x'

      - name: Build (Release)
        if: steps.check.outputs.has_commits == 'true'
        run: dotnet build "Trainer v5 - Beta 1.sln" --configuration Release --no-incremental --property:Version=${{ steps.version.outputs.version }}

      - name: Format
        if: steps.check.outputs.has_commits == 'true'
        run: dotnet format "Trainer v5 - Beta 1.sln" --verify-no-changes

      - name: Test
        if: steps.check.outputs.has_commits == 'true'
        run: dotnet test "Trainer v5 - Beta 1.sln" --configuration Release --no-build

      - name: Stage release files
        if: steps.check.outputs.has_commits == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Copy-Item Trainer_v5/bin/Release/net46/Trainer_v5.dll release/
          Copy-Item -Recurse Trainer_v5/Trainer.Localization release/Trainer.Localization

      - name: Package
        if: steps.check.outputs.has_commits == 'true'
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath Trainer_v5_${{ steps.version.outputs.version }}.zip

      - name: Upload artifact
        if: steps.check.outputs.has_commits == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Trainer_v5_${{ steps.version.outputs.version }}
          path: Trainer_v5_${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Create nightly release
        id: release
        if: steps.check.outputs.has_commits == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trainer v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.version.outputs.commit }}
          files: Trainer_v5_${{ steps.version.outputs.version }}.zip
          draft: true
          prerelease: true
          generate_release_notes: false
          make_latest: false

      - name: Publish nightly release
        if: steps.check.outputs.has_commits == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          ASSET_NAME: Trainer_v5_${{ steps.version.outputs.version }}.zip
        run: |
          # Assets can only be attached while the release is a draft; publishing makes it immutable.
          $release = gh api "repos/$env:GH_REPO/releases/$env:RELEASE_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read draft release $env:RELEASE_ID."
          }

          if (-not $release.draft) {
            throw "Release $env:RELEASE_ID is not a draft; refusing to modify it."
          }

          if (-not ($release.assets | Where-Object { $_.name -eq $env:ASSET_NAME -and $_.state -eq 'uploaded' })) {
            throw "Draft release is missing uploaded asset $env:ASSET_NAME; not publishing."
          }

          gh api --method PATCH "repos/$env:GH_REPO/releases/$env:RELEASE_ID" -F draft=false -F prerelease=true -f make_latest=false
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish release $env:RELEASE_ID."
          }
