name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: Build (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.x'

      - name: Build
        run: dotnet build "Trainer v5 - Beta 1.sln" --configuration Release --no-incremental

      - name: Test
        run: dotnet test "Trainer v5 - Beta 1.sln" --configuration Release --no-build
