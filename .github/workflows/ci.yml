name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build (Release)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '8.x'

      - name: Build
        run: dotnet build "Trainer v5 - Beta 1.sln" --configuration Release --no-incremental

      - name: Format
        run: dotnet format "Trainer v5 - Beta 1.sln" --verify-no-changes

      - name: Test
        run: dotnet test "Trainer v5 - Beta 1.sln" --configuration Release --no-build
