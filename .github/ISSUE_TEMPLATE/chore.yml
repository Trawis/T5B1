name: Chore
description: Update tooling, dependencies, CI, configuration, or documentation
labels: ["type: chore"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the upkeep work.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true after this work is complete?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Optional. Provide useful implementation direction when known.
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: List concrete, observable acceptance conditions.
      placeholder: |
        - Concrete, observable outcome.
    validations:
      required: true
